name: Sync company jobs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Supabase job sync
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          JOB_SYNC_SECRET: ${{ secrets.JOB_SYNC_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-sync-secret: ${JOB_SYNC_SECRET}" \
            --data '{"trigger":"github-actions"}' \
            "${SUPABASE_FUNCTION_URL}/sync-company-jobs"
